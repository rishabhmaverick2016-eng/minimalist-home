name: Build Minimalist Launcher APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Minimalist-Home-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create GitHub Release with APK
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: v1.0.2
        name: "Minimalist Home v1.0.2 (Set Now Dialog Fixed)"
        make_latest: true
        body: |
          ### Minimalist Phone: Couple Edition v1.0.2
          Fixed the "SET NOW" button using Android's official ActivityResultLauncher RoleManager contract and automatic system settings fallback!
          
          **How to install on Android:**
          1. Download `app-debug.apk` below directly to your phone.
          2. Tap the downloaded file to install / update.
          3. When opened, tap **"SET NOW →"** to select Minimalist Home as your default launcher!
          3. When opened, tap **"Set as default launcher"** or press your phone's Home button!
          4. Choose **Minimalist Home** and tap **Always**!
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
